<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
    <div class="image-modal-topbar">
      <button id="closeImageModal" class="modal-close" type="button" autofocus>Close</button>
    </div>
    <img id="modalImage" class="image-modal-image" alt="" />
    <p id="modalImageUnavailable" class="image-modal-unavailable" hidden>Image unavailable</p>
    <div class="image-modal-content">
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="image-modal-date"></p>
      <div id="modalExplanation" class="image-modal-explanation"></div>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
